name: Release

# Fires on a version tag (§15 D956):
#     git tag v0.4.0
#     git push origin v0.4.0
# Builds Mastik on Windows, Linux and macOS and attaches to the tag's GitHub
# Release (created if it does not exist yet):
#
# - the self-updating installers Velopack builds — `Mastik-win-x64-Setup.exe`,
#   `Mastik-linux-x64.AppImage`, `Mastik-osx-arm64-Setup.pkg` and `.dmg` — with the
#   `.nupkg` and `releases.<channel>.json` feed every installed copy polls;
# - portable archives, a `.zip` for Windows and a `.tar.gz` for Linux, which do
#   not update themselves;
# - a `.deb` and an `.rpm`, which the apt and dnf repositories on GitHub Pages
#   carry forward (`pages.yml`, called at the end).
#
# Ported from Schemaic's `release.yml`, which has shipped through many releases;
# the reasons below are its, kept because each one was paid for.
#
# **Two jobs, and only the second can write** (§15 D976, `[X3-L5-03]`). `build`
# runs every third-party tool this workflow uses — the Rust toolchain and its
# build scripts, Zig, `cargo-zigbuild`, .NET, `vpk` — under a read-only token,
# and hands its finished files on as workflow artifacts. `publish` holds
# `contents: write` and runs one pinned action over those files. A compromised
# build tool can still poison what it builds; what it can no longer do is write
# to the repository, move a tag, or edit an earlier Release's feed.
#
# `player`, which builds the browser player, is read-only as `build` is.
#
# `workflow_dispatch` runs `player` and `build` alone: `publish` and `pages` are gated on
# `github.ref_type == 'tag'`. A tag is the expensive way to discover a packaging
# mistake, and a manual run builds and packs every leg with nothing at stake —
# and leaves each leg's assets on the run page, under the names they would ship
# with.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

# Read-only unless a job says otherwise; `publish` is the one that does.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  # ── The browser player ──────────────────────────────────────────────────
  # The wasm and loader `mastik export --prototype` packs into every exported
  # file, built once (wasm is the same on every platform) on the pinned
  # nightly `crates/mastik-web/rust-toolchain.toml` names, and handed to each
  # `build` leg, which puts it where the app looks: `player/` beside the
  # executable, `Contents/Resources/player` in the .app, and
  # `/usr/share/mastik/player` in the .deb and .rpm.
  player:
    name: Build the browser player
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      # Named from the folder's own toolchain file, so the two never disagree.
      - name: Install the player's toolchain
        working-directory: crates/mastik-web
        run: |
          set -euo pipefail
          channel="$(grep -m1 '^channel' rust-toolchain.toml | cut -d'"' -f2)"
          rustup toolchain install "$channel" --profile minimal \
            --component rust-src --target wasm32-unknown-unknown
      # Pinned to the `wasm-bindgen` crate `crates/mastik-web/Cargo.toml` holds;
      # `build.sh` refuses any other version.
      - name: Install wasm-bindgen-cli
        run: cargo install --locked wasm-bindgen-cli --version 0.2.108
      - name: Build the player
        run: bash crates/mastik-web/build.sh target/player
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: player
          path: target/player/
          if-no-files-found: error
          retention-days: 7
          overwrite: true

  build:
    name: Build (${{ matrix.target }})
    needs: player
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # `channel` is Velopack's, and **explicit and unique per os/rid**: left
          # to its default, two platforms would each emit
          # `Mastik-<version>-full.nupkg`, which two jobs cannot both upload to one
          # Release — and worse, `GithubSource` resolves a package by file name
          # across the Release's assets, so a Linux client could be handed the
          # Windows package. Naming the channel puts it in every file name.
          # **A channel is app identity: renaming one orphans every install.**
          # Pinned: 26.04's rpm 6 builds v6 packages, whose signature rpm 4
          # clients (RHEL 8–10, older Fedora) cannot verify.
          - os: ubuntu-24.04
            target: linux-x86_64
            channel: linux-x64
          - os: windows-latest
            target: windows-x86_64
            channel: win-x64
          # Apple Silicon only. Intel Macs would need a channel of their own
          # (`osx-x64`), which is why this one says `arm64`.
          - os: macos-latest
            target: macos-arm64
            channel: osx-arm64
    steps:
      # **No credentials left in `.git/config`** (§15 D974, `[X3-L5-03]`). The
      # token is read-only here since D976, but nothing in this job needs it on
      # disk, and a persisted one is readable by every later step.
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      # Where a `cargo run` build and `packaging/linux/stage-payload.sh` look.
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: player
          path: target/player

      # The only guard a channel name has. Nothing in the Rust tree names one —
      # `update.rs` leaves Velopack's `UpdateOptions` unset — so `cargo test`
      # never sees these strings. It catches a typo, or a rename of a shipped
      # channel in the matrix above; it cannot catch both edited together, and
      # that friction is the point. Adding a platform: add its name here too.
      - name: Check the Velopack channel is a known name
        shell: bash
        env:
          CHANNEL: ${{ matrix.channel }}
        run: |
          set -euo pipefail
          case "$CHANNEL" in
            win-x64 | linux-x64 | osx-arm64) ;;
            *)
              echo "::error::Unknown Velopack channel '$CHANNEL'. Renaming a shipped channel orphans every install on it. Add a name for a new platform; never rename an existing one."
              exit 1
              ;;
          esac

      # The version every leg packs with, resolved once. **The tag and
      # `[workspace.package] version` must agree**: the packages are named from
      # the tag and the binary inside reports Cargo.toml, so tagging without the
      # bump would publish a v$v installer around a binary that says otherwise.
      # Without a tag (a dry run) the workspace version is packed.
      - name: Resolve the package version
        shell: bash
        run: |
          set -euo pipefail
          cargo_v="$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)"
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            v="${GITHUB_REF_NAME#v}"
            if [ "$v" != "$cargo_v" ]; then
              echo "::error::Tag v$v does not match [workspace.package] version $cargo_v in Cargo.toml. Bump the workspace version and re-tag."
              exit 1
            fi
          else
            v="$cargo_v"
            echo "::notice::No tag; packing the workspace version $v as a dry run"
          fi
          # **Plain X.Y.Z only** (§15 D974, `[X3-L1-05]`): rpm's `Version` refuses
          # a `-`, so a `v0.5.0-rc.1` passed the check above and died in rpmbuild
          # after Windows and macOS had already published. Refused here, before
          # any leg builds; a pre-release channel is a decision to make first.
          if ! printf '%s\n' "$v" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::Version $v is not plain X.Y.Z. The Linux packages cannot carry a pre-release suffix."
            exit 1
          fi
          echo "VPK_VERSION=$v" >> "$GITHUB_ENV"

      # Bounded and retried (see `ci.yml`): a stalled mirror never fails on its
      # own, and here a wedged job holds up a release halfway out the door.
      # `rpm` provides `rpmbuild` for `packaging/linux/build-rpm.sh`; the spec
      # compiles nothing, so a Debian-hosted rpmbuild is enough.
      - name: Install Linux GUI build dependencies
        if: runner.os == 'Linux'
        timeout-minutes: 8
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            if sudo timeout 120 apt-get update -o Acquire::Retries=3; then
              break
            fi
            echo "::warning::apt-get update stalled or failed (attempt $attempt of 3), retrying"
            sleep 5
          done
          sudo timeout 300 apt-get install -y libxkbcommon-dev libwayland-dev libxcb1-dev libx11-dev pkg-config rpm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      # Linux: linked against glibc 2.31 (Ubuntu 20.04, Debian 11) through
      # cargo-zigbuild, so the binary runs on distributions older than the
      # runner's glibc 2.39. glibc is not backward-compatible.
      - name: Install Zig (Linux)
        if: runner.os == 'Linux'
        uses: mlugg/setup-zig@v2
        with:
          version: 0.13.0
      - name: Install cargo-zigbuild (Linux)
        if: runner.os == 'Linux'
        # Pinned (§15 D974): a new crates.io release would otherwise run
        # unreviewed at the next tag. The version the v0.4.0 release built with.
        run: cargo install --locked cargo-zigbuild --version 0.23.4
      - name: Build release binary (Linux, glibc 2.31)
        if: runner.os == 'Linux'
        run: cargo zigbuild --release -p mastik-app --bin mastik --target x86_64-unknown-linux-gnu.2.31

      # **Two binaries on Windows** (§15 D953): `mastik.exe` is GUI-subsystem, so
      # the window opens with no console and `mastik export …` at a prompt prints
      # nothing; `mastik-cli` is its console twin, shipped as `mastik.com`.
      - name: Build release binaries (Windows)
        if: runner.os == 'Windows'
        run: cargo build --release -p mastik-app --bin mastik --bin mastik-cli

      # Native: the runner is Apple Silicon and `osx-arm64` the only channel.
      - name: Build release binary (macOS, arm64)
        if: runner.os == 'macOS'
        run: cargo build --release -p mastik-app --bin mastik

      # The binary beside the notices a distributed build must carry, then the
      # portable archive. The notices are every bundled asset's license — Inter
      # and the files under `licenses/` (`THIRD-PARTY-NOTICES.md` lists them).
      - name: Package (Linux)
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          mkdir dist
          cp target/x86_64-unknown-linux-gnu/release/mastik dist/
          cp -r target/player dist/player
          cp LICENSE THIRD-PARTY-NOTICES.md README.md dist/
          cp crates/mastik-core/assets/fonts/OFL.txt dist/Inter-OFL.txt
          cp licenses/*.txt dist/
          tar czf "mastik-${{ github.ref_name }}-${{ matrix.target }}.tar.gz" -C dist .

      # ── Distribution packages ────────────────────────────────────────────
      # A .deb and an .rpm around the same binary. An install under /usr/bin is
      # not a Velopack install, so the in-app check correctly never runs there;
      # what they buy is a desktop entry, icons, AppStream metadata, dependency
      # resolution and a clean uninstall — and updates through the apt and dnf
      # repositories `pages.yml` builds out of these very assets. Published
      # unsigned here and signed there: a release must not be able to fail on a
      # missing GPG key; a repository publish can.
      - name: Build the .deb and .rpm (Linux)
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          binary=target/x86_64-unknown-linux-gnu/release/mastik
          bash packaging/linux/build-deb.sh "$VPK_VERSION" "$binary" dist-packages
          bash packaging/linux/build-rpm.sh "$VPK_VERSION" "$binary" dist-packages
          ls -l dist-packages

      - name: Package (Windows)
        if: runner.os == 'Windows'
        run: |
          New-Item -ItemType Directory dist | Out-Null
          Copy-Item target/release/mastik.exe dist/
          # **Renamed to `.com`, and the extension is the whole mechanism.**
          # `PATHEXT` is `.COM;.EXE;…`, so a bare `mastik` at a prompt resolves to
          # the console twin while shortcuts and Explorer keep the GUI .exe.
          Copy-Item target/release/mastik-cli.exe dist/mastik.com
          Copy-Item -Recurse target/player dist/player
          Copy-Item LICENSE, THIRD-PARTY-NOTICES.md, README.md dist/
          Copy-Item crates/mastik-core/assets/fonts/OFL.txt dist/Inter-OFL.txt
          Copy-Item licenses/*.txt dist/
          Compress-Archive -Path dist/* -DestinationPath "mastik-${{ github.ref_name }}-${{ matrix.target }}.zip"

      # macOS gets no archive of its own: the .dmg below is the macOS deliverable.
      # The .app is built here, Info.plist with its document type, icon and
      # notices included, and `vpk` packs it as it is. The icon is made from
      # `icon-1024.png` on the runner, as only macOS can build an .icns.
      - name: Build Mastik.app (macOS)
        if: runner.os == 'macOS'
        run: |
          set -euo pipefail
          mkdir dist
          bash packaging/macos/build-app.sh "$VPK_VERSION" target/release/mastik dist
          # Data, not code, so in Resources, where the app looks from Contents/MacOS.
          cp -R target/player dist/Mastik.app/Contents/Resources/player

      # ── Velopack: the self-updating artifacts ────────────────────────────
      # A per-user Setup.exe that installs to %LocalAppData% with no UAC prompt,
      # a self-updating AppImage, a macOS .pkg and .app, and the feed each
      # installed copy polls (`update.rs`, §15 D954).
      #
      # **Unsigned, deliberately.** A self-signed certificate chains to no
      # trusted root — SmartScreen still says "Unknown publisher" and no
      # reputation accrues — so this ships honestly unsigned until a real
      # certificate exists; adding one is a `--signParams` argument on `vpk
      # pack`. Velopack's own integrity is HTTPS plus the size and hash in the
      # feed, which signing does not change.
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "8.0.x"
      # **Pinned to the `velopack` crate's own version** (§15 D974): Velopack
      # asks for the CLI and the client library to match, and an unpinned
      # NuGet release would run here unreviewed.
      # `update::tests` reads this line against `Cargo.lock`, so a client bump
      # without this one fails a test rather than a release.
      - name: Install the Velopack CLI
        run: dotnet tool install -g vpk --version 1.2.161

      # The previous release's feed, so `releases.<channel>.json` keeps its
      # history. Non-fatal — the first release has no predecessor — and bounded:
      # `--timeout` is in **minutes** and defaults to 30, which with
      # `continue-on-error` would sit half an hour on an unreachable feed. Skipped
      # without a tag, where the workspace version would be refused as "equal or
      # greater" than the channel's latest. The token is this job's read-only
      # one (§15 D976): the repository is public, and it is passed only for the
      # authenticated rate limit, which a shared runner address can exhaust.
      - name: Fetch the previous release for the feed's history
        if: github.ref_type == 'tag'
        continue-on-error: true
        run: vpk download github --repoUrl https://github.com/${{ github.repository }} --token ${{ secrets.GITHUB_TOKEN }} --channel ${{ matrix.channel }} --timeout 5

      # `--packId` is the app's permanent identity: an installed copy only takes
      # updates with the same id. `--noPortable` on Windows because the .zip
      # above is the portable build already.
      #
      # **`--delta None` is a correctness choice, not a performance one.**
      # Schemaic shipped deltas and the *second* consecutive update failed: a
      # client that reaches version N through a delta holds a locally reassembled
      # package that differs from the one CI built, and the delta for N+1 is
      # computed against CI's copy. Full packages always verify, whatever route a
      # client took.
      - name: Package with Velopack (Windows)
        if: runner.os == 'Windows'
        run: |
          vpk pack `
            --packId Mastik `
            --packVersion $env:VPK_VERSION `
            --packDir dist `
            --mainExe mastik.exe `
            --packTitle Mastik `
            --packAuthors "Mastik contributors" `
            --icon icons/icon.ico `
            --channel ${{ matrix.channel }} `
            --delta None `
            --noPortable

      # `--icon` is required on Linux and must be a PNG; `--categories` fills the
      # AppImage's desktop entry, where Graphics is the freedesktop section a
      # design tool belongs in.
      - name: Package with Velopack (Linux)
        if: runner.os == 'Linux'
        run: |
          vpk pack \
            --packId Mastik \
            --packVersion "$VPK_VERSION" \
            --packDir dist \
            --mainExe mastik \
            --packTitle Mastik \
            --packAuthors "Mastik contributors" \
            --icon icons/icon.png \
            --categories Graphics \
            --channel ${{ matrix.channel }} \
            --delta None

      # Unsigned and un-notarized, as the Windows installer is: Gatekeeper is the
      # cost, and the README says how past it. A `--packDir` ending in `.app` is
      # used as it is, so the bundle's own Info.plist ships; `--bundleId` repeats
      # its id, the one the window, the desktop entry and AppStream use. No
      # `--noPortable`: its zip is the one predictable place the finished .app
      # can be found, which the .dmg step below unpacks.
      - name: Package with Velopack (macOS)
        if: runner.os == 'macOS'
        run: |
          vpk pack \
            --packId Mastik \
            --packVersion "$VPK_VERSION" \
            --packDir dist/Mastik.app \
            --mainExe mastik \
            --packTitle Mastik \
            --packAuthors "Mastik contributors" \
            --icon dist/Mastik.app/Contents/Resources/icon.icns \
            --bundleId io.github.fadion.Mastik \
            --channel ${{ matrix.channel }} \
            --delta None
          # The staging step below names each file and fails on a missing one;
          # this listing is what to read when it does.
          ls -l Releases

      # A .dmg — the app beside a link to /Applications — is what a Mac user
      # expects from a download, and Velopack builds none. A dragged .app updates
      # itself exactly as the .pkg's does: Velopack's locator works from "am I
      # inside a .app", not from how the bundle arrived.
      - name: Build the .dmg (macOS)
        if: runner.os == 'macOS'
        run: |
          set -euo pipefail
          rm -rf dmg-root && mkdir -p dmg-root
          ditto -x -k "Releases/Mastik-${{ matrix.channel }}-Portable.zip" dmg-root
          # The shipped app must still say it opens .mastik files, whatever `vpk`
          # did to the bundle it was given.
          plist=dmg-root/Mastik.app/Contents/Info.plist
          test "$(plutil -extract UTExportedTypeDeclarations.0.UTTypeIdentifier raw "$plist")" = io.github.fadion.Mastik.document
          test "$(plutil -extract CFBundleDocumentTypes.0.LSItemContentTypes.0 raw "$plist")" = io.github.fadion.Mastik.document
          test "$(plutil -extract CFBundleShortVersionString raw "$plist")" = "$VPK_VERSION"
          ln -s /Applications dmg-root/Applications
          hdiutil create -volname Mastik -srcfolder dmg-root -ov -format UDZO \
            "Releases/Mastik-${{ matrix.channel }}.dmg"
          ls -l Releases

      # ── Hand the leg's assets to `publish` ──────────────────────────────
      # Every file this leg ships, each by its exact name, and **strict**: `cp`
      # fails the leg on a missing one, and `publish` runs only once all three
      # legs have succeeded, so a Release carries every platform's assets or
      # none of them (§15 D976). Until then each leg published its own, and its
      # Velopack files with `fail_on_unmatched_files: false` — each leg named
      # all three platforms' files and produced one — so a name `vpk` changed
      # would have dropped silently, and a failed macOS leg left Windows and
      # Linux published beside a hole.
      #
      # Scoped to this version: the fetch above leaves the previous release's
      # .nupkg in `Releases/`, and a glob would re-attach it. No delta — see
      # `--delta None`. `releases.<channel>.json` is the feed installed copies
      # poll, the .deb and .rpm names each format's own version convention.
      - name: Stage the release assets
        shell: bash
        env:
          CHANNEL: ${{ matrix.channel }}
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          mkdir assets
          cp "Releases/Mastik-$VPK_VERSION-$CHANNEL-full.nupkg" "Releases/releases.$CHANNEL.json" assets/
          case "$RUNNER_OS" in
            Windows)
              cp "mastik-$GITHUB_REF_NAME-$TARGET.zip" "Releases/Mastik-$CHANNEL-Setup.exe" assets/
              ;;
            Linux)
              cp "mastik-$GITHUB_REF_NAME-$TARGET.tar.gz" "Releases/Mastik-$CHANNEL.AppImage" assets/
              cp "dist-packages/mastik_${VPK_VERSION}_amd64.deb" "dist-packages/mastik-$VPK_VERSION-1.x86_64.rpm" assets/
              ;;
            macOS)
              # No archive: the .dmg is the macOS deliverable.
              cp "Releases/Mastik-$CHANNEL-Setup.pkg" "Releases/Mastik-$CHANNEL.dmg" assets/
              ;;
            *)
              echo "::error::No asset list for runner OS '$RUNNER_OS'."
              exit 1
              ;;
          esac
          ls -l assets

      # Uncompressed: every asset is an archive or an installer already.
      # `overwrite`, so *Re-run all jobs* replaces what an earlier attempt of
      # this leg uploaded instead of failing on the name. Pinned by commit like
      # every action that touches the assets (§15 D976).
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-${{ matrix.channel }}
          path: assets/
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
          overwrite: true

  # ── The one job that writes ─────────────────────────────────────────────
  # Downloads what the three legs staged and attaches it to the tag's Release,
  # creating the Release if it does not exist yet. Nothing here builds, and the
  # job runs two actions beside the write token, both pinned by commit because
  # a tag can be moved (`v2` → `v2.6.2`, resolved 2026-10-04, §15 D974): the
  # release action, and GitHub's own artifact download — first-party, but code
  # in the writing job all the same (§15 D976).
  #
  # ⚠️ **Strict by saying so** (§15 D974, `[X3-L3-01]`): the action's default
  # for `fail_on_unmatched_files` is `false`, which once let a missing archive
  # ship green. With one job holding every file, there is no longer a step that
  # has to tolerate a platform's absence.
  publish:
    name: Publish the Release
    needs: build
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: release-*
          path: assets
          merge-multiple: true
      - name: List the assets
        run: ls -l assets
      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: assets/*
          fail_on_unmatched_files: true

  # ── The Linux package repositories ──────────────────────────────────────
  # Rebuilds the apt and dnf repositories on GitHub Pages from the release this
  # run just published, so `apt upgrade` and `dnf upgrade` carry Mastik forward.
  #
  # **Called, not triggered.** A release created with `GITHUB_TOKEN` fires no
  # `release` event, and a workflow listening for the tag would start beside
  # this one, before any asset existed. `needs: publish` is the only ordering
  # that is true. A failure here retracts nothing — the Release is complete —
  # and is repaired by running the Pages workflow again from the Actions tab.
  pages:
    name: Publish the Linux package repositories
    needs: publish
    if: github.ref_type == 'tag'
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/pages.yml
    # The tag, so the site build refuses a repository that does not carry this
    # release — a transient download failure would otherwise publish the
    # previous five.
    with:
      expect_version: ${{ github.ref_name }}
    secrets: inherit
