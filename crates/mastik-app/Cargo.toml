[package]
name = "mastik-app"
edition.workspace = true
version.workspace = true
license.workspace = true
repository.workspace = true
# **`cargo run -p mastik-app` means the app**: `src/bin/mastik-cli.rs` makes this
# crate two binaries, and cargo refuses to pick between two without this —
# which broke the README's build command and every headless `export` recipe in
# AGENTS.md with "could not determine which binary to run".
default-run = "mastik"

# The `mastik` binary: GUI shell + `serve`/`export` subcommands. Only this crate
# may depend on egui/winit (§3). Ties the whole graph together.
#
# ⚠️ **And it is the second crate allowed `wgpu`, which §3 denied until 2026-09-15**
# (§15 D774). eframe owns the device; vello renders the canvas and
# egui-wgpu composites it, so the two must share one wgpu — and `mastik-render`'s
# seam takes `&Device`, `&Queue` and `&TextureView`, so this crate cannot call it
# without naming the types. `canvas.rs` is where they are named — count them with
# `grep -cE '(^|[^A-Za-z0-9_])wgpu::' src/canvas.rs`, not with a number written
# here, and note that the path is `use eframe::wgpu`: there is no `use wgpu::`
# anywhere in `src/`, so this line is an interop *pin* rather than what makes the
# source compile. **vello and vello_cpu are still this crate's to never
# declare**, which is the half of the old rule that was true, and it is now
# tested (`mastik-core/tests/deps_forbidden.rs`).
[[bin]]
name = "mastik"
path = "src/main.rs"

[dependencies]
mastik-core = { path = "../mastik-core" }
mastik-render = { path = "../mastik-render" }
mastik-export = { path = "../mastik-export" }
mastik-mcp = { path = "../mastik-mcp" }
mastik-ai = { path = "../mastik-ai" }
mastik-vm = { path = "../mastik-vm" }
# The prototype player's engine, with *Run script* (its default `scripts`).
mastik-play = { path = "../mastik-play" }
# The map `mastik_vm::Env` takes its labels in; already in the tree through core.
rustc-hash.workspace = true
# eframe (default features) brings egui + egui-wgpu + winit at matching versions.
# `persistence` is for the window's size, position and maximized state alone
# (`main::run_gui`): eframe clamps a restored position to the monitors present.
eframe = { workspace = true, features = ["persistence"] }
egui.workspace = true
egui-wgpu.workspace = true
wgpu.workspace = true
rfd.workspace = true
# Image decoding and content hashing for placement (§5.5a). Both are already in
# the workspace lock — `image` through `arboard`/`eframe`, `ring` through
# `ureq`/`rustls` — so these declare edges at versions already compiled, the same
# reasoning §3 records for `skrifa`/`read-fonts` in core.
image.workspace = true
arboard.workspace = true
ring = "0.17.14"
fontdb.workspace = true
ureq.workspace = true
dirs.workspace = true
qrcode.workspace = true
velopack.workspace = true
log.workspace = true
woff2.workspace = true
serde.workspace = true
serde_json.workspace = true
# *Import files* opens a `.sketch` file, a zip of JSON and pictures; core reads the
# entries (`mastik_core::sketch_in`) and stays free of an archive reader. The
# workspace's own, already built for the code export's zip.
zip.workspace = true
# …and Penpot 1's `.penpot`, a zstd stream that `mastik_core::penpot_v1` unpacks.
ruzstd.workspace = true
# Spell check's word breaks (`spell::words`).
unicode-segmentation.workspace = true

# Three uses, the workspace root's comment naming each feature and whose it is:
# the desktop cursor position a Windows file drag never sends (`GetCursorPos`,
# `canvas::os_cursor_desktop_px`, §15 D241); the library's local dates
# (`library::clock::local_offset`, §15 D384); and `mastik.com`'s job object, which
# ends the `mastik.exe` it started when it ends itself (`src/bin/mastik-cli.rs`,
# §15 D971). The crate is compiled here by `winit` regardless.
[target.'cfg(windows)'.dependencies]
windows-sys.workspace = true
# Spell check's COM checker (`spell::windows`); `windows-sys` has no COM interfaces.
windows.workspace = true

# Spell check's Enchant, opened at run time (`spell::enchant`).
[target.'cfg(target_os = "linux")'.dependencies]
libloading.workspace = true

# Spell check's `NSSpellChecker` (`spell::macos`), the OS's open-documents
# event (`open_event`), and the traffic lights' place (`traffic_lights`).
[target.'cfg(target_os = "macos")'.dependencies]
objc2.workspace = true
objc2-foundation.workspace = true
objc2-app-kit.workspace = true
raw-window-handle.workspace = true

# `ai::Session::idle`, so the assistant's tests can hold a live session.
[dev-dependencies]
mastik-ai = { path = "../mastik-ai", features = ["test-support"] }

# The same question on the two Unix platforms that ship: the library's local
# dates, through `localtime_r` (`library::clock::local_offset`, §15 D959), and the
# resource meter's CPU time and memory (`meter.rs`).
[target.'cfg(any(target_os = "linux", target_os = "macos"))'.dependencies]
libc.workspace = true

# `build.rs` only. The app icon is two separate things and this is the half that
# is not code: the resource compiler writes the `.ico` into `mastik.exe` itself,
# where Explorer reads it. The *window's* icon is `main::window_icon`, decoded
# RGBA handed to winit at startup, and neither one covers the other's surfaces.
[target.'cfg(windows)'.build-dependencies]
winresource.workspace = true
